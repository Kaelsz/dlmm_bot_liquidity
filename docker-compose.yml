services:
  radar:
    build: .
    image: meteora-pool-radar
    container_name: radar
    restart: unless-stopped
    # Boucle locale uniquement : l'accès extérieur passe par Caddy, qui porte
    # l'authentification. L'app elle-même n'en a aucune — ne jamais publier ce
    # port sur 0.0.0.0.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # La base porte tout l'historique dérivé. Sans ce volume, chaque
      # redémarrage repart de zéro et les colonnes dérivées mettent 15 min à
      # redevenir lisibles.
      - radar-data:/data
    environment:
      DB_PATH: /data/radar.db
      COLLECTOR: "on"
      LOG_LEVEL: info
    # SQLite en WAL n'aime pas être tué brutalement pendant un checkpoint.
    stop_grace_period: 30s

  caddy:
    image: caddy:2-alpine
    container_name: radar-caddy
    restart: unless-stopped
    depends_on:
      - radar
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Persiste l'autorité interne : sans ça un nouveau certificat est émis à
      # chaque redémarrage et le navigateur redemande d'accepter le risque.
      - caddy-data:/data
      - caddy-config:/config
    # Compose interpole AUSSI les valeurs d'un env_file : une valeur non quotée
    # contenant `$` est amputée (vérifié : `$2a$14$ICFOs…` devient `$2a$14`).
    # Seules les apostrophes simples rendent la valeur littérale — c'est ainsi
    # que scripts/deploy.sh écrit radar.env.
    #
    # Le fichier ne s'appelle pas .env à dessein : Compose charge tout .env du
    # répertoire projet comme source d'interpolation du compose lui-même, ce
    # qui ajoutait une seconde voie de corruption.
    env_file:
      - radar.env

volumes:
  radar-data:
  caddy-data:
  caddy-config:
